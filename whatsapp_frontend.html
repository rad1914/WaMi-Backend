<!-- @path: whatsapp_frontend.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp API Frontend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 95%;
            max-width: 1400px;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(45deg, #25D366, #128C7E);
            padding: 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .session-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #44ff44;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .auth-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 20px 0;
        }

        .qr-code {
            width: 256px;
            height: 256px;
        }

        .sidebar {
            width: 400px;
            background: #f8f9fa;
            border-right: 1px solid #e1e8ed;
            display: flex;
            flex-direction: column;
        }

        .search-bar {
            padding: 20px;
            border-bottom: 1px solid #e1e8ed;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #25D366;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-item:hover {
            background: #f0f8ff;
        }

        .chat-item.active {
            background: #e3f2fd;
            border-right: 3px solid #25D366;
        }

        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(45deg, #25D366, #128C7E);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .chat-last-message {
            color: #666;
            font-size: 14px;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e1e8ed;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f5f7fa;
        }

        .message {
            margin: 10px 0;
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
        }

        .message.received .message-bubble {
            background: white;
            border-bottom-left-radius: 4px;
        }

        .message.sent .message-bubble {
            background: #25D366;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-actions {
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .action-btn {
            background: rgba(0,0,0,0.1);
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e1e8ed;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 20px;
            max-height: 100px;
        }

        .message-input:focus {
            border-color: #25D366;
        }

        .send-btn, .btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .send-btn:hover, .btn:hover {
            background: #128C7E;
        }

        .btn.secondary {
            background: #6c757d;
        }

        .btn.secondary:hover {
            background: #5a6268;
        }

        .btn.danger {
            background: #dc3545;
        }

        .btn.danger:hover {
            background: #c82333;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #25D366;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-header h3 {
            margin: 0;
        }

        .close-btn {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .typing-indicator {
            display: none;
            padding: 10px;
            color: #666;
            font-style: italic;
        }

        .emoji-picker {
            display: none;
            position: absolute;
            bottom: 60px;
            right: 20px;
            background: white;
            border: 1px solid #e1e8ed;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-height: 200px;
            overflow-y: auto;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
        }

        .emoji {
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            text-align: center;
            font-size: 18px;
        }

        .emoji:hover {
            background: #f0f0f0;
        }

        .file-input {
            display: none;
        }

        .attachment-btn {
            background: #6c757d;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #25D366;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            z-index: 1001;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: #28a745;
        }

        .notification.error {
            background: #dc3545;
        }

        .notification.info {
            background: #17a2b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 WhatsApp API</h1>
            <div class="session-info">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="sessionStatus">Disconnected</span>
                <div class="controls">
                    <button class="btn" onclick="showSessionModal()">Connect Session</button>
                    <button class="btn" onclick="createSession()">New Session</button>
                    <button class="btn secondary" onclick="reloadSession()">Reload</button>
                    <button class="btn danger" onclick="removeSession()">Remove</button>
                </div>
            </div>
        </div>

        <div class="main-content">
            
            <div class="auth-screen" id="authScreen">
                <h2>🔐 WhatsApp Authentication</h2>
                <div id="authContent">
                    <p>Choose how you want to connect:</p>
                    <div class="auth-options" style="margin: 30px 0;">
                        <button class="btn" onclick="showSessionModal()" style="margin: 0 10px 10px 0;">📱 Use Existing Session</button>
                        <button class="btn" onclick="createSession()" style="margin: 0 10px 10px 0;">🆕 Create New Session</button>
                    </div>
                </div>
                <div class="qr-container hidden" id="qrContainer">
                    <div class="loading" id="qrLoading"></div>
                    <canvas class="qr-code hidden" id="qrCode"></canvas>
                </div>
                <div id="qrActions" class="hidden" style="margin-top: 15px;">
                    <button class="btn" onclick="getQRCode()">🔄 Refresh QR Code</button>
                    <button class="btn secondary" onclick="showAuthOptions()">← Back to Options</button>
                </div>
            </div>

            
            <div class="sidebar hidden" id="sidebar">
                <div class="search-bar">
                    <input type="text" class="search-input" placeholder="🔍 Search chats..." id="searchInput">
                </div>
                <div class="chat-list" id="chatList">
                    
                </div>
            </div>

            <div class="chat-area hidden" id="chatArea">
                <div class="chat-header" id="chatHeader">
                    <div class="chat-avatar" id="currentChatAvatar">?</div>
                    <div class="chat-info">
                        <div class="chat-name" id="currentChatName">Select a chat</div>
                        <div class="chat-last-message" id="currentChatStatus">Online</div>
                    </div>
                    <div class="controls">
                        <button class="btn secondary" onclick="showSendMessageModal()">📤 Send Message</button>
                    </div>
                </div>
                
                <div class="messages-container" id="messagesContainer">
                    
                </div>
                
                <div class="typing-indicator" id="typingIndicator">
                    Someone is typing...
                </div>

                <div class="input-area">
                    <input type="file" class="file-input" id="fileInput" accept="image/*,video/*,audio/*,.pdf,.doc,.docx">
                    <button class="attachment-btn" onclick="document.getElementById('fileInput').click()">
                        📎
                    </button>
                    <button class="attachment-btn" onclick="toggleEmojiPicker()">
                        😀
                    </button>
                    <textarea class="message-input" id="messageInput" placeholder="Type a message..." rows="1"></textarea>
                    <button class="send-btn" onclick="sendMessage()">Send</button>
                </div>

                <div class="emoji-picker" id="emojiPicker">
                    <div class="emoji-grid" id="emojiGrid">
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    
    <div class="modal" id="sessionModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close-btn" onclick="closeModal('sessionModal')">&times;</span>
                <h3>📱 Connect to Existing Session</h3>
            </div>
            <div class="form-group">
                <label for="existingSessionId">Session ID:</label>
                <input type="text" id="existingSessionId" placeholder="Enter your existing session ID">
                <small style="color: #666; display: block; margin-top: 5px;">
                    Enter the session ID from your previous connection
                </small>
            </div>
            <div class="controls">
                <button class="btn" onclick="connectExistingSession()">🔗 Connect</button>
                <button class="btn secondary" onclick="closeModal('sessionModal')">Cancel</button>
            </div>
        </div>
    </div>

    <div class="modal" id="sendMessageModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close-btn" onclick="closeModal('sendMessageModal')">&times;</span>
                <h3>📤 Send Message</h3>
            </div>
            <div class="form-group">
                <label for="sendJid">Phone Number:</label>
                <input type="text" id="sendJid" placeholder="e.g., +1234567890 or 1234567890@s.whatsapp.net">
                <small style="color: #666; display: block; margin-top: 5px;">
                    Enter with country code (e.g., +1234567890) or full JID
                </small>
            </div>
            <div class="form-group">
                <label for="sendType">Message Type:</label>
                <select id="sendType">
                    <option value="text">📝 Text</option>
                    <option value="image">📷 Image URL</option>
                    <option value="video">🎥 Video URL</option>
                    <option value="audio">🎵 Audio URL</option>
                    <option value="document">📄 Document URL</option>
                    <option value="sticker">🎭 Sticker URL</option>
                </select>
            </div>
            <div class="form-group">
                <label for="sendContent">Content:</label>
                <textarea id="sendContent" rows="4" placeholder="Message text or media URL"></textarea>
            </div>
            <div class="controls">
                <button class="btn" onclick="sendCustomMessage()">📤 Send</button>
                <button class="btn secondary" onclick="closeModal('sendMessageModal')">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script>
        // Configuration
        const API_BASE = 'http://192.168.1.68:3000/api';
        
        // Global state
        let currentSession = null;
        let currentChat = null;
        let chats = [];
        let isAuthenticated = false;
        let messagePollingInterval = null;

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            generateEmojiPicker();
            
            // Try to restore session from localStorage
            const savedSession = localStorage.getItem('whatsapp_session');
            if (savedSession) {
                currentSession = savedSession;
                updateSessionDisplay();
                checkAuthStatus().then(authenticated => {
                    if (authenticated) {
                        showChatInterface();
                        updateStatus('Connected', true);
                        loadChats();
                        startMessagePolling();
                    } else {
                        showAuthScreen();
                        updateStatus('Session Found - Reconnect Required', false);
                        showNotification('Previous session found. Click "Connect Session" to reconnect.', 'info');
                    }
                });
            }
        });

        function setupEventListeners() {
            // Message input auto-resize
            const messageInput = document.getElementById('messageInput');
            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });

            // Send message on Enter
            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // File input change
            document.getElementById('fileInput').addEventListener('change', handleFileUpload);

            // Search chats
            document.getElementById('searchInput').addEventListener('input', filterChats);
        }

        function generateEmojiPicker() {
            const emojis = ['😀','😃','😄','😁','😆','😅','🤣','😂','🙂','🙃','😉','😊','😇','🥰','😍','🤩','😘','😗','😚','😙','🥲','😋','😛','😜','🤪','😝','🤑','🤗','🤭','🤫','🤔','🤐','🤨','😐','😑','😶','😏','😒','🙄','😬','🤥','😌','😔','😪','🤤','😴','😷','🤒','🤕','🤢','🤮','🤧','🥵','🥶','🥴','😵','🤯','🤠','🥳','🥸','😎','🤓','🧐','😕','😟','🙁','☹️','😮','😯','😲','😳','🥺','😦','😧','😨','😰','😥','😢','😭','😱','😖','😣','😞','😓','😩','😫','🥱','😤','😡','😠','🤬','😈','👿','💀','☠️','💩','🤡','👹','👺','👻','👽','👾','🤖'];
            const emojiGrid = document.getElementById('emojiGrid');
            emojiGrid.innerHTML = emojis.map(emoji => 
                `<div class="emoji" onclick="insertEmoji('${emoji}')">${emoji}</div>`
            ).join('');
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('messageInput');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;
            input.value = text.substring(0, start) + emoji + text.substring(end);
            input.selectionStart = input.selectionEnd = start + emoji.length;
            input.focus();
            document.getElementById('emojiPicker').style.display = 'none';
        }

        function toggleEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.style.display = picker.style.display === 'none' ? 'block' : 'none';
        }

        // API Functions
        async function apiRequest(endpoint, options = {}) {
            const url = `${API_BASE}${endpoint}`;
            const config = {
                headers: {
                    'Content-Type': 'application/json',
                    ...(currentSession && { 'x-session-id': currentSession })
                },
                ...options
            };

            if (config.body && typeof config.body === 'object') {
                config.body = JSON.stringify(config.body);
            }

            try {
                const response = await fetch(url, config);
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || `HTTP ${response.status}`);
                }
                
                return data;
            } catch (error) {
                console.error(`API Error (${endpoint}):`, error);
                showNotification(error.message, 'error');
                throw error;
            }
        }

        async function connectExistingSession() {
            const sessionId = document.getElementById('existingSessionId').value.trim();
            
            if (!sessionId) {
                showNotification('Please enter a session ID', 'error');
                return;
            }

            try {
                showNotification('Connecting to existing session...', 'info');
                
                // Set the session ID
                currentSession = sessionId;
                localStorage.setItem('whatsapp_session', currentSession);
                updateSessionDisplay();
                
                // Check if session is already authenticated
                const isAuth = await checkAuthStatus();
                
                if (isAuth) {
                    // Session is already authenticated
                    closeModal('sessionModal');
                    showChatInterface();
                    updateStatus('Connected', true);
                    await loadChats();
                    startMessagePolling();
                    showNotification('Connected to existing session!', 'success');
                } else {
                    // Session exists but needs QR code authentication
                    closeModal('sessionModal');
                    showQRScreen();
                    updateStatus('Session Found - Scan QR Code', false);
                    await getQRCode();
                }
                
            } catch (error) {
                showNotification('Failed to connect to session. Session may not exist.', 'error');
                currentSession = null;
                localStorage.removeItem('whatsapp_session');
                updateStatus('Disconnected', false);
            }
        }

        async function createSession() {
            try {
                showNotification('Creating new session...', 'info');
                const response = await apiRequest('/auth/create', { method: 'POST' });
                currentSession = response.sessionId;
                localStorage.setItem('whatsapp_session', currentSession);
                updateSessionDisplay();
                showNotification(`Session created! ID: ${response.sessionId}`, 'success');
                
                // Show QR code
                showQRScreen();
                await getQRCode();
            } catch (error) {
                showNotification('Failed to create session', 'error');
            }
        }

        async function removeSession() {
            if (!currentSession) {
                showNotification('No active session', 'error');
                return;
            }

            try {
                await apiRequest('/auth/remove', {
                    method: 'DELETE',
                    body: { sessionId: currentSession }
                });
                
                currentSession = null;
                isAuthenticated = false;
                localStorage.removeItem('whatsapp_session');
                
                // Reset UI
                showAuthScreen();
                updateStatus('Disconnected', false);
                showNotification('Session removed successfully', 'success');
                
                if (messagePollingInterval) {
                    clearInterval(messagePollingInterval);
                    messagePollingInterval = null;
                }
            } catch (error) {
                showNotification('Failed to remove session', 'error');
            }
        }

        async function reloadSession() {
            if (!currentSession) {
                showNotification('No active session', 'error');
                return;
            }

            try {
                showNotification('Reloading session...', 'info');
                await apiRequest('/auth/reload', {
                    method: 'POST',
                    body: { sessionId: currentSession }
                });
                showNotification('Session reloaded successfully', 'success');
                
                // Check if we need QR code or if already authenticated
                const isAuth = await checkAuthStatus();
                if (isAuth) {
                    showChatInterface();
                    updateStatus('Connected', true);
                    await loadChats();
                    startMessagePolling();
                } else {
                    showQRScreen();
                    await getQRCode();
                }
            } catch (error) {
                showNotification('Failed to reload session', 'error');
            }
        }

        async function getQRCode() {
            if (!currentSession) {
                showNotification('No active session. Create one first.', 'error');
                return;
            }

            const qrLoading = document.getElementById('qrLoading');
            const qrCode = document.getElementById('qrCode');
            
            qrLoading.classList.remove('hidden');
            qrCode.classList.add('hidden');

            try {
                const response = await apiRequest('/auth/qr');
                
                if (response.success) {
                    // Already authenticated
                    isAuthenticated = true;
                    showChatInterface();
                    updateStatus('Connected', true);
                    await loadChats();
                    startMessagePolling();
                    showNotification('Already authenticated!', 'success');
                } else if (response.qr) {
                    // Display QR code
                    displayQRCode(response.qr);
                    updateStatus('Scan QR Code to Connect', false);
                    
                    // Start checking auth status
                    startAuthCheck();
                }
            } catch (error) {
                qrLoading.classList.add('hidden');
                if (error.message.includes('QR not yet available')) {
                    showNotification('QR code not ready yet, retrying...', 'info');
                    setTimeout(getQRCode, 2000);
                } else {
                    showNotification('Failed to get QR code: ' + error.message, 'error');
                }
            }
        }

        function displayQRCode(qrData) {
            const qrLoading = document.getElementById('qrLoading');
            const qrCode = document.getElementById('qrCode');
            
            const qr = qrcode(0, 'M');
            qr.addData(qrData);
            qr.make();
            
            const canvas = qrCode;
            const ctx = canvas.getContext('2d');
            const size = 256;
            canvas.width = size;
            canvas.height = size;
            
            const modules = qr.getModuleCount();
            const cellSize = size / modules;
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#000000';
            
            for (let row = 0; row < modules; row++) {
                for (let col = 0; col < modules; col++) {
                    if (qr.isDark(row, col)) {
                        ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                    }
                }
            }
            
            qrLoading.classList.add('hidden');
            qrCode.classList.remove('hidden');
        }

        function selectChat(jid, name) {

                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            // Update chat header
            document.getElementById('currentChatAvatar').textContent = name.charAt(0).toUpperCase();
            document.getElementById('currentChatName').textContent = name;
            document.getElementById('currentChatStatus').textContent = 'Online';

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content || !currentChat) {
                if (!currentChat) {
                    showNotification('Please select a chat first', 'error');
                }
                return;
            }

            try {
                await apiRequest('/message/send', {
                    method: 'POST',
                    body: {
                        jid: currentChat.id,
                        type: 'text',
                        content: content
                    }
                });

                // Add message to UI
                addMessageToChat({
                    content: content,
                    type: 'text',
                    fromMe: true,
                    timestamp: new Date()
                });

                input.value = '';
                input.style.height = 'auto';
                showNotification('Message sent!', 'success');
                
            } catch (error) {
                showNotification('Failed to send message', 'error');
            }
        }

        function addMessageToChat(message) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${message.fromMe ? 'sent' : 'received'}`;
            
            const time = new Date(message.timestamp).toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            messageDiv.innerHTML = `
                <div class="message-bubble">
                    ${formatMessageContent(message)}
                    <div style="font-size: 11px; opacity: 0.7; margin-top: 5px;">
                        ${time}
                    </div>
                </div>
                <div class="message-actions">
                    <button class="action-btn" onclick="replyToMessage('${message.id || Date.now()}')" title="Reply">↩️</button>
                    <button class="action-btn" onclick="reactToMessage('${message.id || Date.now()}')" title="React">❤️</button>
                    ${message.fromMe ? `<button class="action-btn" onclick="deleteMessage('${message.id || Date.now()}')" title="Delete">🗑️</button>` : ''}
                    ${message.fromMe ? `<button class="action-btn" onclick="editMessage('${message.id || Date.now()}')" title="Edit">✏️</button>` : ''}
                </div>
            `;
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function formatMessageContent(message) {
            switch (message.type) {
                case 'text':
                    return `<div>${escapeHtml(message.content)}</div>`;
                case 'image':
                    return `<div>📷 Image</div><div style="font-size: 12px; color: #666;">${message.content}</div>`;
                case 'video':
                    return `<div>🎥 Video</div><div style="font-size: 12px; color: #666;">${message.content}</div>`;
                case 'audio':
                    return `<div>🎵 Audio</div><div style="font-size: 12px; color: #666;">${message.content}</div>`;
                case 'document':
                    return `<div>📄 Document</div><div style="font-size: 12px; color: #666;">${message.content}</div>`;
                case 'sticker':
                    return `<div>🎭 Sticker</div>`;
                default:
                    return `<div>${escapeHtml(message.content || 'Message')}</div>`;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file || !currentChat) return;

            const maxSize = 50 * 1024 * 1024; // 50MB
            if (file.size > maxSize) {
                showNotification('File too large. Maximum size is 50MB.', 'error');
                return;
            }

            try {
                showNotification('Uploading file...', 'info');
                
                // Create FormData for file upload
                const formData = new FormData();
                formData.append('file', file);
                
                // For demo purposes, we'll use a placeholder URL
                // In a real implementation, you'd upload to your file server
                const fileUrl = URL.createObjectURL(file);
                
                // Determine message type based on file type
                let messageType = 'document';
                if (file.type.startsWith('image/')) messageType = 'image';
                else if (file.type.startsWith('video/')) messageType = 'video';
                else if (file.type.startsWith('audio/')) messageType = 'audio';

                await apiRequest('/message/send', {
                    method: 'POST',
                    body: {
                        jid: currentChat.id,
                        type: messageType,
                        content: fileUrl,
                        options: {
                            fileName: file.name
                        }
                    }
                });

                addMessageToChat({
                    content: fileUrl,
                    type: messageType,
                    fromMe: true,
                    timestamp: new Date(),
                    id: Date.now()
                });

                showNotification('File sent!', 'success');
                
            } catch (error) {
                showNotification('Failed to send file', 'error');
            }
            
            // Reset file input
            event.target.value = '';
        }

            // Remove any non-digit characters except +
            const cleaned = phone.replace(/[^\d+]/g, '');
            
            // Add @s.whatsapp.net if not present
            if (!phone.includes('@')) {
                return cleaned + '@s.whatsapp.net';
            }
            
            return phone;
        }
