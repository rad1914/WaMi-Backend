<!-- @path: index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WhatsApp-like Web Messaging Frontend</title>
  <style>
    :root{--bg:#0f1724;--panel:#0b1220;--muted:#94a3b8;--accent:#06b6d4;--msg-sent:#05203a;--msg-recv:#0b2a18}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#071023 0%,#0b1220 100%);font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial}
    .app{display:grid;grid-template-columns:300px 1fr 320px;height:100vh;gap:12px;padding:12px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);border-radius:12px;padding:12px;color:#e6eef8;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
    .sidebar{display:flex;flex-direction:column}
    .top{display:flex;gap:8px;align-items:center}
    button{background:var(--accent);border:none;padding:8px 12px;border-radius:8px;color:#022;cursor:pointer}
    input,select,textarea{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px;border-radius:8px;color:inherit}
    .chats{margin-top:12px;overflow:auto}
    .chat-item{padding:10px;border-radius:8px;display:flex;align-items:center;gap:10px;cursor:pointer}
    .chat-item:hover{background:rgba(255,255,255,0.02)}
    .messages{display:flex;flex-direction:column;height:100%;}
    .messages-list{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
    .composer{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(255,255,255,0.03)}
    .message{max-width:70%;padding:10px;border-radius:10px}
    .from-me{align-self:flex-end;background:var(--msg-sent)}
    .from-other{align-self:flex-start;background:var(--msg-recv)}
    .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
    .qr-wrap{display:flex;gap:12px;align-items:center}
    .qr{background:#fff;padding:8px;border-radius:8px}
    .actions{display:flex;gap:6px}
    .small-btn{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:6px;border-radius:8px;color:var(--muted);cursor:pointer}
    .right-panel{display:flex;flex-direction:column;gap:8px}
    .file-preview{max-width:220px;border-radius:8px}
    footer{font-size:12px;color:var(--muted);padding:6px;text-align:center}
    @media(max-width:1000px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}.right-panel{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <div class="card sidebar">
      <div class="top">
        <strong>Sessions</strong>
        <div style="margin-left:auto;display:flex;gap:8px">
          <button id="createSessionBtn">New</button>
          <button id="removeSessionBtn">Remove</button>
        </div>
      </div>

      <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
        <input id="sessionIdInput" placeholder="sessionId (or create)" />
        <button id="loadSessionBtn" class="small-btn">Load</button>
      </div>

      <div style="margin-top:10px">
        <div style="display:flex;align-items:center;justify-content:space-between"><span>QR / Auth</span><button id="refreshQR" class="small-btn">Refresh</button></div>
        <div style="margin-top:8px" class="qr-wrap">
          <div id="qrContainer" class="qr">No QR</div>
          <div style="flex:1">
            <div>Status: <span id="authStatus">—</span></div>
            <div style="margin-top:8px"><button id="checkStatusBtn" class="small-btn">Check</button></div>
          </div>
        </div>
      </div>

      <div style="margin-top:12px;flex:1;display:flex;flex-direction:column">
        <strong>Chats</strong>
        <div id="chats" class="chats"></div>
      </div>

      <footer>Backend: <code id="apiRoot">http://localhost:3000/api</code></footer>
    </div>

    <div class="card messages">
      <div style="display:flex;align-items:center;gap:12px">
        <div><strong id="chatTitle">Select a chat</strong></div>
        <div style="margin-left:auto;display:flex;gap:8px">
          <button id="loadMessagesBtn" class="small-btn">Load</button>
          <button id="clearMessagesBtn" class="small-btn">Clear</button>
        </div>
      </div>

      <div id="messagesList" class="messages-list"></div>

      <div class="composer">
        <input id="toJid" placeholder="to: 12345@s.whatsapp.net or group jid" style="flex:0 0 260px;" />
        <input id="messageInput" placeholder="Type message or paste image/video url" style="flex:1" />
        <select id="typeSelect">
          <option value="text">text</option>
          <option value="image">image</option>
          <option value="video">video</option>
          <option value="audio">audio</option>
          <option value="document">document</option>
          <option value="sticker">sticker</option>
        </select>
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <div class="card right-panel">
      <strong>Selected Message</strong>
      <pre id="selectedJson" style="white-space:pre-wrap;background:rgba(255,255,255,0.02);padding:8px;border-radius:8px;max-height:320px;overflow:auto">No message selected</pre>

      <div style="display:flex;flex-direction:column;gap:6px">
        <button id="replyBtn" class="small-btn">Reply</button>
        <button id="reactBtn" class="small-btn">React</button>
        <button id="editBtn" class="small-btn">Edit (fromMe)</button>
        <button id="deleteBtn" class="small-btn">Delete (fromMe)</button>
        <button id="forwardBtn" class="small-btn">Forward</button>
      </div>

      <div style="margin-top:auto">
        <strong>Helpers</strong>
        <div style="margin-top:8px">Paste a message JSON from the wire into the box below to forward or to test replies.</div>
        <textarea id="manualMessageJson" rows="6" style="width:100%;margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,0.04);padding:8px;border-radius:8px;color:inherit"></textarea>
      </div>
    </div>
  </div>

  
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

  <script>
    const API_ROOT = localStorage.getItem('API_ROOT') || 'http://22.ip.gl.ply.gg:18880/api';
    document.getElementById('apiRoot').textContent = API_ROOT;

    const state = {
      sessionId: localStorage.getItem('sessionId') || '',
      chats: [],
      messages: [],
      selectedChat: null,
      selectedMessage: null
    };

    // --- helpers ---
    function api(path, opts = {}){
      const headers = Object.assign({}, opts.headers || {});
      if (state.sessionId) headers['x-session-id'] = state.sessionId;
      return fetch(API_ROOT + path, {...opts, headers}).then(async r => {
        const txt = await r.text();
        try { return JSON.parse(txt); } catch { return txt; }
      }).catch(e => { console.error('api error', e); throw e; });
    }

    function setSession(id){
      state.sessionId = id;
      localStorage.setItem('sessionId', id);
      document.getElementById('sessionIdInput').value = id;
      connectSocket();
      loadChats();
      renderAuth();
    }

    // --- session actions ---
    document.getElementById('createSessionBtn').addEventListener('click', async ()=>{
      const res = await api('/auth/create', { method: 'POST' });
      if (res?.sessionId) setSession(res.sessionId);
    });

    document.getElementById('removeSessionBtn').addEventListener('click', async ()=>{
      if (!state.sessionId) return alert('No session loaded');
      await api('/auth/remove', { method: 'DELETE', body: JSON.stringify({ sessionId: state.sessionId }), headers: {'Content-Type':'application/json'} });
      localStorage.removeItem('sessionId');
      state.sessionId = '';
      document.getElementById('sessionIdInput').value = '';
      document.getElementById('qrContainer').innerHTML = 'No QR';
      document.getElementById('authStatus').textContent = '—';
    });

    document.getElementById('loadSessionBtn').addEventListener('click', ()=>{
      const id = document.getElementById('sessionIdInput').value.trim();
      if (!id) return alert('Enter sessionId');
      setSession(id);
    });

    // --- QR and auth ---
    async function renderAuth(){
      if (!state.sessionId) return;
      try{
        const qrRes = await api('/auth/qr?sessionId=' + encodeURIComponent(state.sessionId));
        if (qrRes?.qr){
          const qrEl = document.getElementById('qrContainer');
          qrEl.innerHTML = '';
          const canvas = document.createElement('canvas');
          qrEl.appendChild(canvas);
          QRCode.toCanvas(canvas, qrRes.qr, { width: 180 }).catch(()=>{ qrEl.textContent = qrRes.qr });
        }
      }catch(e){ /* ignore */ }

      try{
        const status = await api('/auth/status?sessionId=' + encodeURIComponent(state.sessionId));
        document.getElementById('authStatus').textContent = status?.authenticated ? 'Authenticated' : 'Not authenticated';
      }catch(e){ document.getElementById('authStatus').textContent = 'Error' }
    }

    document.getElementById('checkStatusBtn').addEventListener('click', renderAuth);
    document.getElementById('refreshQR').addEventListener('click', renderAuth);

    // --- socket.io realtime ---
    let socket;
    function connectSocket(){
      if (!state.sessionId) return;
      if (socket) socket.disconnect();
      socket = io(new URL(API_ROOT).origin, { transports: ['websocket'], reconnectionAttempts: 5 });

      socket.on('connect', ()=>console.log('socket connected', socket.id));
      socket.on('disconnect', ()=>console.log('socket disconnected'));

      socket.on('whatsapp-message', ({ sessionId, message }) => {
        if (sessionId !== state.sessionId) return;
        addOrUpdateMessage(message);
      });

      socket.on('whatsapp-message-status', ({ sessionId, updates }) => {
        if (sessionId !== state.sessionId) return;
        updates.forEach(u => {
          const msg = state.messages.find(m => m.key && m.key.id === u.key?.id);
          if (msg) Object.assign(msg, u);
        });
        renderMessages();
      });

      socket.on('connect_error', (e)=>{ console.warn('socket connect error', e); });
    }

    // --- chats and messages ---
    async function loadChats(){
      if (!state.sessionId) return;
      try{
        const chats = await api('/chats');
        state.chats = Array.isArray(chats) ? chats : [];
        renderChats();
      }catch(e){ console.error(e) }
    }

    function renderChats(){
      const el = document.getElementById('chats'); el.innerHTML = '';
      state.chats.forEach(c => {
        const d = document.createElement('div'); d.className = 'chat-item';
        d.innerHTML = `<div style="font-weight:600">${c.name || c.id}</div><div style="font-size:12px;color:var(--muted)">${c.unread || ''}</div>`;
        d.addEventListener('click', ()=>selectChat(c));
        el.appendChild(d);
      });
    }

    async function selectChat(chat){
      state.selectedChat = chat; state.selectedMessage = null;
      document.getElementById('chatTitle').textContent = chat.name || chat.id;
      document.getElementById('toJid').value = chat.id;

      // NEW: load message history from backend endpoint
      try {
        const msgs = await api('/chats/' + encodeURIComponent(chat.id) + '/messages');
        state.messages = Array.isArray(msgs) ? msgs : [];
      } catch (err) {
        console.warn('failed loading chat messages', err);
        state.messages = [];
      }
      renderMessages();
    }

    function addOrUpdateMessage(message){
      const id = message?.key?.id;
      if (!id) return;
      const idx = state.messages.findIndex(m => m.key?.id === id);
      if (idx >= 0) state.messages[idx] = message;
      else state.messages.push(message);
      renderMessages();
    }

    function renderMessages(){
      const list = document.getElementById('messagesList'); list.innerHTML = '';
      state.messages.slice().forEach(msg => {
        const acct = (msg.key?.fromMe) ? 'me' : (msg.pushName || msg.sender?.pushname || msg.key?.remoteJid);
        const wrapper = document.createElement('div'); wrapper.className = 'message ' + ((msg.key?.fromMe) ? 'from-me' : 'from-other');
        const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = acct + ' — ' + (msg.key?.id || '');
        const body = document.createElement('div');
        const payload = msg.message;
        if (!payload) body.textContent = JSON.stringify(msg, null, 2);
        else if (payload.conversation) body.textContent = payload.conversation;
        else if (payload.image?.caption || payload.image?.mimetype) {
          const img = document.createElement('img'); img.src = payload.image.url || payload.image; img.className = 'file-preview'; body.appendChild(img); if (payload.image.caption) body.append(payload.image.caption);
        } else if (payload.video) { const v = document.createElement('video'); v.src = payload.video.url || payload.video; v.controls = true; v.className='file-preview'; body.appendChild(v); }
        else if (payload.document) { const a=document.createElement('a'); a.href=payload.document.url; a.target='_blank'; a.textContent = payload.document.fileName || 'document'; body.appendChild(a); }
        else if (payload.sticker) { const img=document.createElement('img'); img.src=payload.sticker.url || payload.sticker; img.className='file-preview'; body.appendChild(img);}
        else if (payload.text) body.textContent = payload.text;
        else body.textContent = JSON.stringify(payload);

        wrapper.appendChild(meta); wrapper.appendChild(body);

        wrapper.addEventListener('click', ()=>{
          state.selectedMessage = msg; document.getElementById('selectedJson').textContent = JSON.stringify(msg, null, 2);
        });

        list.appendChild(wrapper);
      });
      list.scrollTop = list.scrollHeight;
    }

    document.getElementById('loadMessagesBtn').addEventListener('click', ()=>renderMessages());
    document.getElementById('clearMessagesBtn').addEventListener('click', ()=>{ state.messages = []; renderMessages(); });

    // --- sending messages ---
    document.getElementById('sendBtn').addEventListener('click', async ()=>{
      const jid = document.getElementById('toJid').value.trim();
      const content = document.getElementById('messageInput').value.trim();
      const type = document.getElementById('typeSelect').value;
      if (!jid || !content) return alert('to and content required');
      const body = { jid, type, content };
      try{
        const res = await api('/message/send', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
        console.log('send res', res);
      }catch(e){ console.error(e); alert('send failed') }
    });

    // --- message actions ---
    document.getElementById('replyBtn').addEventListener('click', async ()=>{
      if (!state.selectedMessage) return alert('select a message');
      const content = prompt('Reply text:'); if (!content) return;
      const jid = state.selectedMessage.key.remoteJid || document.getElementById('toJid').value;
      const quotedMessageId = state.selectedMessage.key.id;
      await api('/message/reply', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ jid, content, quotedMessageId }) });
    });

    document.getElementById('reactBtn').addEventListener('click', async ()=>{
      if (!state.selectedMessage) return alert('select a message');
      const emoji = prompt('Emoji to react with (e.g. 👍):'); if (!emoji) return;
      const jid = state.selectedMessage.key.remoteJid || document.getElementById('toJid').value;
      const messageId = state.selectedMessage.key.id;
      await api('/message/react', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ jid, messageId, emoji }) });
    });

    document.getElementById('editBtn').addEventListener('click', async ()=>{
      if (!state.selectedMessage) return alert('select a message');
      const newText = prompt('New text:'); if (newText == null) return;
      const jid = state.selectedMessage.key.remoteJid || document.getElementById('toJid').value;
      const messageId = state.selectedMessage.key.id;
      await api('/message/edit', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ jid, messageId, newText }) });
    });

    document.getElementById('deleteBtn').addEventListener('click', async ()=>{
      if (!state.selectedMessage) return alert('select a message');
      const ok = confirm('Delete for me? Cancel to delete for everyone (if allowed)');
      const fromMe = ok;
      const jid = state.selectedMessage.key.remoteJid || document.getElementById('toJid').value;
      const messageId = state.selectedMessage.key.id;
      await api('/message/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ jid, messageId, fromMe }) });
    });

    document.getElementById('forwardBtn').addEventListener('click', async ()=>{
      const manual = document.getElementById('manualMessageJson').value.trim();
      let messageObj = null;
      if (manual) {
        try { messageObj = JSON.parse(manual); } catch { return alert('invalid JSON') }
      } else {
        if (!state.selectedMessage) return alert('select a message or paste message JSON');
        messageObj = state.selectedMessage;
      }
      const to = prompt('Forward to (jid):'); if (!to) return;
      await api('/message/forward', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ to, message: messageObj }) });
    });

    // init
    document.getElementById('sessionIdInput').value = state.sessionId;
    if (state.sessionId) { connectSocket(); loadChats(); renderAuth(); }

    // convenience: reload chats every minute
    setInterval(()=>{ if (state.sessionId) loadChats(); }, 60_000);
  </script>
</body>
</html>
